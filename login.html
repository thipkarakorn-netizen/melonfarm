<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — ANNAS Melon Farm</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070b14;
      position: relative;
      overflow: hidden;
    }

    #bg-img {
      position: fixed;
      inset: 0;
      background: url('https://static.thairath.co.th/media/dFQROr7oWzulq5Fa4MRmDabcVFvpFswAyfamB6hNEDBrWwKG3yJJot3axN6OHyhwtaN.webp') center / cover no-repeat;
      filter: brightness(.35) saturate(.6);
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 16px;
    }

    .login-card {
      background: rgba(11,17,32,0.88);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon { font-size: 48px; line-height: 1; margin-bottom: 10px; }
    .logo-title { font-size: 20px; font-weight: 700; color: #39e87a; }
    .logo-sub { font-size: 12px; color: rgba(148,163,184,.6); margin-top: 4px; }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      color: rgba(210,225,240,.8);
      margin-bottom: 7px;
      font-weight: 500;
    }

    input[type="email"] {
      width: 100%;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: #f0f6fc;
      font-family: 'Kanit', sans-serif;
      outline: none;
    }

    input[type="email"]:focus {
      border-color: #39e87a;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    input[type="text"]::placeholder {
      color: rgba(148,163,184,.4);
    }

    /* ── Password row ── */
    .pw-row {
      display: flex;
      align-items: stretch;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      overflow: hidden;
    }

    .pw-row:focus-within { border-color: #39e87a; }

    .pw-row input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      color: #f0f6fc;
      font-family: 'Kanit', sans-serif;
      outline: none;
      min-width: 0;
    }

    .toggle-pw {
      flex-shrink: 0;
      width: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(148,163,184,.55);
      background: transparent;
      border: none;
      border-left: 1px solid rgba(255,255,255,.08);
      transition: color 0.2s, background 0.2s;
    }

    .toggle-pw:hover { color: #39e87a; background: rgba(57,232,122,.06); }

    .btn-login {
      width: 100%;
      background: #39e87a;
      color: #070b14;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Kanit', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-login:hover { background: #5ff094; }
    .btn-login:disabled { background: #2a5c3f; color: #64748b; cursor: not-allowed; }

    .msg {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }

    .msg.error { background: rgba(240,85,85,.12); border: 1px solid rgba(240,85,85,.3); color: #f08585; }
    .msg.success { background: rgba(57,232,122,.10); border: 1px solid rgba(57,232,122,.25); color: #39e87a; }

    .footer-text {
      text-align: center;
      font-size: 11px;
      color: rgba(100,116,139,.5);
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div id="bg-img"></div>
  <div class="login-wrap">
    <div class="login-card">

      <div class="logo">
        <div class="logo-icon">🍈</div>
        <div class="logo-title">ANNAS Melon Farm</div>
        <div class="logo-sub">ระบบจัดการฟาร์มเมล่อน</div>
      </div>

      <div class="form-group">
        <label>อีเมล</label>
        <input type="email" id="inp-email" placeholder="กรอกอีเมล" autocomplete="email">
      </div>

      <div class="form-group">
        <label>รหัสผ่าน</label>
        <div class="pw-row">
          <input type="password" id="inp-pass" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
          <button class="toggle-pw" id="btn-eye" type="button" tabindex="-1">
            <!-- eye open -->
            <svg id="svg-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- eye off -->
            <svg id="svg-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-login" id="btn-login">เข้าสู่ระบบ</button>
      <div class="msg error" id="msg-error"></div>
      <div class="msg success" id="msg-ok"></div>

      <div class="footer-text">🌱 ระบบเพื่อควบคุมการให้ปุ๋ยที่เหมาะสมต่อการเจริญเติบโต</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPA_URL = 'https://tlybqoazpymbzpnnouag.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRseWJxb2F6cHltYnpwbm5vdWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjE0ODEsImV4cCI6MjA5NjYzNzQ4MX0.yTY70QYCX_6MsvHkLhbZGv6fCzz4x0M8SiNXkgqXw5Y';
    const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

    // redirect ถ้า login อยู่แล้ว
    sb.auth.getSession().then(({ data }) => {
      if (data.session) location.replace('./lastapp/realapp/index.html');
    });

    // ── ลูกตา toggle ──
    const btnEye  = document.getElementById('btn-eye');
    const inpPass = document.getElementById('inp-pass');
    const svgOn   = document.getElementById('svg-eye');
    const svgOff  = document.getElementById('svg-eye-off');

    btnEye.addEventListener('click', function() {
      if (inpPass.type === 'password') {
        inpPass.type     = 'text';
        svgOn.style.display  = 'none';
        svgOff.style.display = 'block';
      } else {
        inpPass.type     = 'password';
        svgOn.style.display  = 'block';
        svgOff.style.display = 'none';
      }
    });

    // ── Enter ──
    inpPass.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    // ── Login ──
    document.getElementById('btn-login').addEventListener('click', login);

    async function login() {
      const email = document.getElementById('inp-email').value.trim();
      const pass  = inpPass.value;
      const errEl = document.getElementById('msg-error');
      const okEl  = document.getElementById('msg-ok');
      const btn   = document.getElementById('btn-login');

      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      if (!email || !pass) {
        errEl.textContent    = 'กรุณากรอกอีเมลและรหัสผ่าน';
        errEl.style.display  = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';

      const { error } = await sb.auth.signInWithPassword({ email, password: pass });

      if (error) {
        btn.disabled    = false;
        btn.textContent = 'เข้าสู่ระบบ';
        errEl.textContent   = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
        errEl.style.display = 'block';
        return;
      }

      okEl.textContent   = 'เข้าสู่ระบบสำเร็จ กำลังโหลด...';
      okEl.style.display = 'block';
      setTimeout(() => location.replace('./lastapp/realapp/index.html'), 800);
    }
  </script>
</body>
</html>
